<div class="card">
  <div class="flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">Category Management</h2>
    <button
      pButton
      type="button"
      label="Add Category"
      icon="pi pi-plus"
      (click)="openAddDialog()">
    </button>
  </div>

  <p-table [value]="categories" [loading]="loading" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Category Name</th>
        <th>Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-category>
      <tr>
        <td>{{ category.id }}</td>
        <td>{{ category.name }}</td>
        <td>
          <div class="flex gap-2">
            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              severity="info"
              (click)="openEditDialog(category)">
            </button>

            <button
              pButton
              type="button"
              icon="pi pi-trash"
              severity="danger"
              (click)="deleteCategory(category.id)">
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [header]="isEditMode ? 'Edit Category' : 'Add Category'"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '28rem' }">

  <div class="field mb-4">
    <label for="name" class="block mb-2 font-medium">Category Name</label>
    <input
      id="name"
      type="text"
      pInputText
      [(ngModel)]="currentCategory.name"
      class="w-full" />
  </div>

  <div class="flex justify-content-end gap-2">
    <button
      pButton
      type="button"
      label="Cancel"
      severity="secondary"
      (click)="dialogVisible = false">
    </button>

    <button
      pButton
      type="button"
      [label]="isEditMode ? 'Update' : 'Save'"
      (click)="saveCategory()">
    </button>
  </div>
</p-dialog>
