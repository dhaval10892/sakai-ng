<div class="card mb-4">
    <div class="flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h2 class="m-0">Table {{ tableNumber }}</h2>
            <p class="text-500 mb-0">Browse menu and add items to your cart</p>
        </div>
        <button pButton type="button" icon="pi pi-shopping-cart" [label]="'Cart (' + cartCount + ')'" (click)="openCart()"></button>
    </div>
</div>
<div class="card mb-4">
    <div class="flex flex-wrap gap-2">
        <button
            *ngFor="let category of categories"
            pButton
            type="button"
            [label]="category"
            [severity]="selectedCategory === category ? 'primary' : 'secondary'"
            [outlined]="selectedCategory !== category"
            (click)="filterByCategory(category)"
        ></button>
    </div>
</div>

<p-drawer [(visible)]="cartVisible" position="right" [style]="{ width: '20rem' }">
    <ng-template pTemplate="header">
        <h3 class="m-0">Your Cart</h3>
    </ng-template>

    <div *ngIf="filteredItems.length === 0">
        <p>Your cart is empty.</p>
    </div>

    <div *ngIf="filteredItems.length > 0" class="flex flex-column gap-3">
        <div *ngFor="let item of cartItems" class="flex justify-content-between align-items-center border-bottom-1 surface-border pb-3">
            <div>
                <div class="font-medium">{{ item.menuItem.name }}</div>
                <small>{{item.quantity}} X {{item.menuItem.price.toFixed(2) }}</small>
            </div>

            <div class="flex align-items-center gap-2">
                <button pButton type="button" icon="pi pi-minus" class="p-button-sm p-button-text" (click)="decreaseQuantity(item.menuItem.id)"></button>

                <span></span>

                <button pButton type="button" icon="pi pi-plus" class="p-button-sm p-button-text" (click)="increaseQuantity(item.menuItem.id)"></button>
            </div>
        </div>

        <div class="mt-3">
            <h4>Total: ${{ total.toFixed(2) }}</h4>

            <button pButton type="button" label="Proceed to Checkout" class="w-full" (click)="goToCheckout()"></button>
        </div>
    </div>
</p-drawer>
<div class="grid">
  <div class="col-12">
    <p-carousel
      [value]="filteredItems"
      [numVisible]="3"
      [numScroll]="3"
      [circular]="false"
      [responsiveOptions]="carouselResponsiveOptions">

      <ng-template pTemplate="item" let-item>
        <div class="menu-card">

          <!-- IMAGE -->
          <div class="menu-image-wrapper">
            <img
              *ngIf="item.imageUrl"
              [src]="item.imageUrl"
              [alt]="item.name"
              class="menu-image"
            />
          </div>

          <!-- CONTENT -->
          <div class="menu-content">

            <div class="menu-header">
              <h4>{{ item.name }}</h4>
            </div>

            <div class="menu-footer">
              <span class="price">
                ${{ item.price.toFixed(2) }}
              </span>

              <button
                pButton
                type="button"
                icon="pi pi-shopping-cart"
                label="Add"
                class="p-button-sm add-btn"
                (click)="addToCart(item)">
              </button>
            </div>

          </div>

        </div>
      </ng-template>

    </p-carousel>
  </div>
</div>
