<div class="card">
  <div class="flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">Tables Management</h2>
    <button pButton type="button" label="Add Table" icon="pi pi-plus" (click)="openAddDialog()"></button>
  </div>
  <p-table [value]="tables">
    <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Table Number</th>
          <th>Seats</th>
          <th>Status</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-table>
      <tr>
        <td>{{table.id}}</td>
        <td>{{table.number}}</td>
        <td>{{table.seats}}</td>
        <td>
          <p-tag [value]="table.status" [severity]="getSeverity(table.status)">
          </p-tag>
        </td>
        <td>
          <div class="flex gap-2">

            <button 
            pButton 
            type="button"
            icon="pi pi-pencil"
            (click)="openEditDialog(table)">
            </button>
            <button
            pButton
            type="button"
            icon="pi pi-check"
            severity="success"
            [outlined]="true"
            (click)="markAvailable(table)"
            [disabled]="table.status==='Available'"
            ></button>
            <button
            pButton
            type="button"
            icon="pi pi-trash"
            severity="danger"
            (click)="deleteTable(table.id)">
            </button>
        </div>
        </td>
      </tr>

    </ng-template>
  </p-table>
</div>

<p-dialog 
[header]="isEditMode ? 'Edit Table': 'Add New Table'"
[modal]="true"
[contentStyle]="{ overflow: 'visible' }"
[(visible)]="isVisible"
[style]="{width:'30rem'}">

<div class="filed mb-3">
  <label for="number" class="block mb-2 font-medium">Table Number</label>
  <input type="text" id="numbe" pInputText [(ngModel)]="currentTable.number" class="w-full"/>
</div>
<div class="filed mb-3">
  <label for="seats" class="block mb-2 font-medium">Seats</label>
  <p-inputNumber inputId="seats" [(ngModel)]="currentTable.seats" mode="decimal" [min]="1" class="w-full" >
    </p-inputNumber>
  </div>
<div class="filed mb-4">
  <label for="status" class="block mb-2 font-medium">Status</label>
  <p-select inputId="status"    [options]="statusOptions" [(ngModel)]="currentTable.status" optionLabel="label" optionValue="value" placeholder="Select Status" class="w-full">
  </p-select>
</div>
<div class="flex justify-content-end gap-2" >
  <button 
  pButton
  label="Cancel"
  type="button"
  severity="secondary"
  (click)="isVisible=false">
</button>
<button 
pButton
[label]="isEditMode ? 'Update' : 'Save'"
(click)="saveTable()">
</button>
</div>
</p-dialog>
