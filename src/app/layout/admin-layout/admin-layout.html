<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="eyebrow">Restaurant SaaS</span>
      <h2>Control Center</h2>
      <p>Manage brands, restaurants, and growth from one warm, modern workspace.</p>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/super-admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <i class="pi pi-home"></i>
        <span>Dashboard</span>
      </a>

      <a routerLink="/super-admin/restaurants" routerLinkActive="active">
        <i class="pi pi-building"></i>
        <span>Restaurants</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button
        pButton
        type="button"
        icon="pi pi-sign-out"
        label="Logout"
        severity="danger"
        class="w-full"
        (click)="logout()">
      </button>
    </div>
  </aside>

  <main>
    <div class="admin-main-shell">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
